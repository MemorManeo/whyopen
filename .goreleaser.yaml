version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: whyopen
    main: ./cmd/whyopen
    binary: whyopen
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files:
      - README.md
      - LICENSE

nfpms:
  - id: whyopen
    package_name: whyopen
    formats: [deb, rpm]
    maintainer: MemorManeo <304054918+MemorManeo@users.noreply.github.com>
    description: Reports which ports are reachable from the internet and which nftables rules decide that.
    license: Apache-2.0
    bindir: /usr/bin

checksum:
  name_template: checksums.txt

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 2
