name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: |
          go vet ./...
          go vet -tags integration ./...
      - name: test
        run: go test ./...

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
      - name: install tools
        run: sudo apt-get update && sudo apt-get install -y iptables nftables
      # A skip is not a pass. Capture the output and fail if nothing ran.
      - name: integration suite
        run: |
          sudo -E env "PATH=$PATH" go test -tags integration ./test/integration/ -v 2>&1 | tee /tmp/it.log
          if grep -q -- "--- SKIP" /tmp/it.log; then
            echo "integration tests skipped, which this job exists to prevent"
            grep -- "--- SKIP" /tmp/it.log
            exit 1
          fi
          grep -q -- "--- PASS" /tmp/it.log || (echo "no tests ran" && exit 1)
